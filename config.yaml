corpus:
  chunks_path: ~/Downloads/mamai-medical-guidelines/processed/chunks_for_rag.txt
  release_manifest_path: ~/Downloads/mamai-medical-guidelines/releases/rag-bundle-v0.2.0/manifest.json

queries:
  target_total: 5000
  questions_per_chunk: 1
  synthesis_questions: true
  adversarial_fraction: 0.15
  random_seed: 42

source_tiers:
  very_high:
    queries_per_source: 520
    sources:
      - hesperian-a-book-for-midwives
      - msf-essential-obstetric-and-newborn-care
      - midwifery-essentials-6
  high:
    queries_per_source: 285
    sources:
      - oxford-handbook-of-midwifery
      - skills-for-midwifery-practice
      - who-midwifery-education-modules-2
      - who-midwifery-education-modules-3
      - who-midwifery-education-modules-4
      - who-midwifery-education-modules-5
      - who-midwifery-education-modules-6
      - who-platform-malta-guide-for-midwifery-skills
  moderate_high:
    queries_per_source: 225
    sources:
      - midwifery-essentials-3
  moderate:
    queries_per_source: 173
    sources:
      - clinical-practice-guidelines-midwifery-womens-health
      - midwifery-essentials-2
      - midwifery-essentials-5
      - who-essential-childbirth-care-course
      - nmc-midwifery-marking-criteria
      - icm-essential-competencies-for-midwifery-practice
  low_moderate:
    queries_per_source: 113
    sources:
      - nmc-midwifery-mock-osce

models:
  query_generation: gpt-4o-mini
  llm_judge: gpt-4o

retrieval:
  top_k: 10
  pool_retrievers:
    - bm25
    - dense
  dense_model: sentence-transformers/all-MiniLM-L6-v2

audit:
  n_queries: 30
  top_k_exhaustive: 20
  n_retrievers_exhaustive: 6
